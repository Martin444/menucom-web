[build]
    command = "flutter build web --release --dart-define=API_URL=https://menucom-api-60e608ae2f99.herokuapp.com --dart-define=MP_PUBLIC_KEY=APP_USR-3ee7f54a-686a-49b4-8592-40610ab7d742"
    publish = "build/web"

[context.production.environment]
    API_URL = "https://menucom-api-60e608ae2f99.herokuapp.com"

[functions]
    directory = "netlify/functions"

# NO capturar archivos estáticos (JS, CSS, imágenes, etc.)
[[redirects]]
    from = "/*"
    to = "/:splat"
    status = 200
    conditions = {Path = ["/**.js", "/**.css", "/**.png", "/**.jpg", "/**.svg", "/**.json", "/**.wasm", "/**.map"]}

# Redirect para UUIDs (formato específico)
# Solo captura rutas que parecen UUIDs (8-4-4-4-12 caracteres hexadecimales)
[[redirects]]
    from = "/:id"
    to = "/.netlify/functions/preview?id=:id"
    status = 200
    force = true
    
# SPA Fallback para rutas que no son UUIDs ni archivos estáticos
[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200