[build]
    command = "flutter build web --release --dart-define=API_URL=https://menucom-api-60e608ae2f99.herokuapp.com --dart-define=MP_PUBLIC_KEY=APP_USR-3ee7f54a-686a-49b4-8592-40610ab7d742"
    publish = "build/web"

[context.production.environment]
    API_URL = "https://menucom-api-60e608ae2f99.herokuapp.com"

[functions]
    directory = "netlify/functions"

# ⚠️ IMPORTANTE: Netlify sirve archivos estáticos automáticamente desde build/web
# NO necesitamos redirects para .js, .css, .png, etc.
# Solo definimos redirects para:
# 1. UUIDs de comercios (/:id -> preview function)
# 2. Fallback SPA (/* -> index.html)

# Preview para UUIDs de comercios: la función detecta User-Agent
# - Bot social → HTML con Open Graph tags optimizado
# - Usuario normal → index.html completo con URL preservada
# Solo aplica a rutas de un segmento que parecen UUIDs
[[redirects]]
    from = "/:id"
    to = "/.netlify/functions/preview?id=:id"
    status = 200
    force = false
    
# SPA Fallback para todas las demás rutas
# Aplica solo si el archivo no existe físicamente
[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200