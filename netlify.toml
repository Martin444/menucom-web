[build]
    command = "flutter clean && flutter build web --release --dart-define=API_URL=https://menucom-api.onrender.com --dart-define=WS_URL=https://menucom-api.onrender.com --dart-define=MP_PUBLIC_KEY=APP_USR-3ee7f54a-686a-49b4-8592-40610ab7d742 --dart-define=ACCESS_TOKEN_SECRET_KEY=p7Xv9QmL2eR8sTzY4bN1aCwV6jKdFgHu"
    publish = "build/web"

[context.production.environment]
    API_URL = "https://menucom-api.onrender.com"
    WS_URL = "https://menucom-api.onrender.com"

[functions]
    directory = "netlify/functions"

[[edge_functions]]
  function = "preview-bot"
  path = "/:id"

# ⚠️ IMPORTANTE: Netlify sirve archivos estáticos automáticamente desde build/web
# NO necesitamos redirects para .js, .css, .png, etc.
# Solo definimos redirects para:
# 1. Fallback SPA (/* -> index.html) para que Flutter maneje el routing

# SPA Fallback: todas las rutas sirven index.html
# Netlify sirve archivos físicos primero (JS, CSS, etc.) antes de aplicar este redirect
# Flutter lee la URL del navegador y extrae el commerce ID en runtime
[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200