[build]
    command = "flutter build web --release --dart-define=API_URL=https://menucom-api-60e608ae2f99.herokuapp.com --dart-define=MP_PUBLIC_KEY=APP_USR-3ee7f54a-686a-49b4-8592-40610ab7d742"
    publish = "build/web"

[context.production.environment]
    API_URL = "https://menucom-api-60e608ae2f99.herokuapp.com"

[functions]
    directory = "netlify/functions"

# Excluir archivos estáticos explícitamente (deben ir ANTES del redirect de UUIDs)
[[redirects]]
    from = "/*.js"
    to = "/:splat.js"
    status = 200

[[redirects]]
    from = "/*.css"
    to = "/:splat.css"
    status = 200

[[redirects]]
    from = "/*.json"
    to = "/:splat.json"
    status = 200

[[redirects]]
    from = "/*.wasm"
    to = "/:splat.wasm"
    status = 200

[[redirects]]
    from = "/*.map"
    to = "/:splat.map"
    status = 200

[[redirects]]
    from = "/*.png"
    to = "/:splat.png"
    status = 200

[[redirects]]
    from = "/*.jpg"
    to = "/:splat.jpg"
    status = 200

[[redirects]]
    from = "/*.svg"
    to = "/:splat.svg"
    status = 200

[[redirects]]
    from = "/*.ico"
    to = "/:splat.ico"
    status = 200

# Redirect para UUIDs: solo captura rutas que parecen IDs
[[redirects]]
    from = "/:id"
    to = "/.netlify/functions/preview?id=:id"
    status = 200
    force = false
    
# SPA Fallback para todas las demás rutas
[[redirects]]
    from = "/*"
    to = "/index.html"
    status = 200