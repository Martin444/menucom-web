<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Catalogo para clientes CSM">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Menucom Catalogo">
  
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

  <link rel="apple-touch-icon" href="logomenucom.png">
  <link rel="canonical" href="https://menu-commerce.netlify.app/${id}" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logomenucom.png"/>

  <title>Menu com</title>
  <link rel="manifest" href="manifest.json">
  <!-- MercadoPago.js V2 -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <!-- Bridge sencillo para usar MercadoPago desde Flutter Web -->
  <script src="mercadopago_bridge.js"></script>
  <style>
    #loader {
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;  
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
    }
    
    #loader.hidden {
      display: none;
    }
    
    #loader > div {
      width: 30px;
      height: 30px;
      position: relative;
      border: 3px solid #1336e5;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 2s linear infinite;
      margin-bottom: 20px;
    }    

    #loader > span {
      color: black;
      
    }
      
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div></div>
    <span>Estamos preparando todo para ti, por favor espera un momento... </span>
  </div>

  <!-- Inyección de configuración de Flutter -->
  {{flutter_js}}
  {{flutter_build_config}}

  <script>
    // Función de manejo de errores robusta (Estilo Dashboard)
    function handleSplashError(errorType, error) {
      console.error('🔥 [SPLASH ERROR]', errorType, ':', error);
      var text = document.querySelector("#loader > span");
      if (text) {
        text.innerHTML = "⚠️ Error al cargar: " + (error.message || error);
        text.style.color = "#FF6B6B";
      }
      var spinner = document.querySelector("#loader > div");
      if (spinner) spinner.style.display = "none";
    }

    window.addEventListener('load', function() {
      console.log('🚀 [SPLASH] Iniciando secuencia de carga maestra en Catálogo...');
      
      try {
        var serviceWorkerVersion = '{{flutter_service_worker_version}}';
        if (serviceWorkerVersion) {
          serviceWorkerVersion = serviceWorkerVersion.split('/*')[0].replace(/["']/g, '').trim();
        }
        console.log('📦 [SPLASH] SW Version:', serviceWorkerVersion || 'N/A');

        if (typeof _flutter === 'undefined' || !_flutter.loader) {
          throw new Error('El cargador de Flutter (_flutter.loader) no se inicializó.');
        }

        _flutter.loader.load({
          serviceWorkerSettings: {
            serviceWorkerVersion: serviceWorkerVersion,
          },
          onEntrypointLoaded: function(engineInitializer) {
            console.log('✅ [SPLASH] Entrypoint OK. Inicializando motor...');
            
            engineInitializer.initializeEngine({
              serviceWorkerVersion: serviceWorkerVersion,
              useColorEmoji: true,
              trustedTypes: false, // Mantenemos esta prueba activa
            }).then(function(appRunner) {
              console.log('🎯 [SPLASH] Motor OK. Ejecutando app...');
              return appRunner.runApp();
            }).then(function() {
              console.log('🎉 [SPLASH] Catálogo listo.');
              setTimeout(function() {
                var loader = document.getElementById("loader");
                if (loader) loader.classList.add("hidden");
              }, 500);
            }).catch(function(error) {
              handleSplashError('Error en initializeEngine/runApp', error);
            });
          }
        });
      } catch (e) {
        handleSplashError('Error crítico de inicialización', e);
      }
    });
  </script>
</body>
</html>
