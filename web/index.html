<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Catalogo para clientes CSM">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Menucom Catalogo">
  
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">

  <link rel="apple-touch-icon" href="logomenucom.png">
  <link rel="canonical" href="https://menu-commerce.netlify.app/${id}" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="logomenucom.png"/>

  <title>Menu com</title>
  <script>
    // Manifest dinámico: detecta commerce ID en la URL y crea el link
    // al manifest ANTES de que el navegador lo descargue
    (function() {
      var commerceId = null;
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      if (pathParts.length > 0) {
        var last = pathParts[pathParts.length - 1];
        var uuidPattern = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
        if (uuidPattern.test(last)) {
          commerceId = last;
        }
      }
      console.log('[PWA-DEBUG] Path:', window.location.pathname);
      console.log('[PWA-DEBUG] commerceId detected:', commerceId);

      var manifestHref = commerceId
        ? '/.netlify/functions/manifest?id=' + commerceId
        : 'manifest.json';
      console.log('[PWA-DEBUG] Manifest href:', manifestHref);

      var link = document.createElement('link');
      link.rel = 'manifest';
      link.id = 'manifest-link';
      link.href = manifestHref;
      link.onload = function() { console.log('[PWA-DEBUG] Manifest link loaded OK'); };
      link.onerror = function(e) { console.error('[PWA-DEBUG] Manifest link load FAILED', e); };
      document.head.appendChild(link);
      console.log('[PWA-DEBUG] Manifest link appended to <head>');
    })();
  </script>
  <!-- MercadoPago.js V2 -->
  <script src="https://sdk.mercadopago.com/js/v2"></script>
  <!-- Bridge sencillo para usar MercadoPago desde Flutter Web -->
  <script src="mercadopago_bridge.js"></script>
  <!-- PWA Install Prompt Handler -->
  <script>
    console.log('[PWA-DEBUG] Install handler script loaded');
    console.log('[PWA-DEBUG] display-mode:', window.matchMedia('(display-mode: standalone)').matches ? 'standalone' : 'browser');
    console.log('[PWA-DEBUG] Protocol:', window.location.protocol);
    console.log('[PWA-DEBUG] Hostname:', window.location.hostname);

    window._deferredPrompt = null;

    window.addEventListener('beforeinstallprompt', function(e) {
      console.log('[PWA-DEBUG] beforeinstallprompt FIRED!', e);
      e.preventDefault();
      window._deferredPrompt = e;
      window.dispatchEvent(new CustomEvent('pwa-install-available'));
      console.log('[PWA-DEBUG] pwa-install-available dispatched, _deferredPrompt set');
    });

    window.addEventListener('appinstalled', function() {
      console.log('[PWA-DEBUG] appinstalled FIRED!');
      window._deferredPrompt = null;
      window.dispatchEvent(new CustomEvent('pwa-installed'));
    });

    window.isPwaInstallAvailable = function() {
      var available = window._deferredPrompt !== null;
      console.log('[PWA-DEBUG] isPwaInstallAvailable called, result:', available);
      return available;
    };

    window.triggerPwaInstall = function() {
      console.log('[PWA-DEBUG] triggerPwaInstall called, _deferredPrompt:', !!window._deferredPrompt);
      var prompt = window._deferredPrompt;
      if (prompt) {
        prompt.prompt();
        return prompt.userChoice.then(function(result) {
          console.log('[PWA-DEBUG] userChoice result:', result.outcome);
          window._deferredPrompt = null;
          return result.outcome === 'accepted';
        });
      }
      console.warn('[PWA-DEBUG] triggerPwaInstall: no prompt available');
      return Promise.resolve(false);
    };

    // Diagnostic: check if env supports PWA install
    setTimeout(function() {
      console.log('[PWA-DEBUG] === DIAGNOSTIC (3s after load) ===');
      console.log('[PWA-DEBUG] _deferredPrompt:', !!window._deferredPrompt);
      console.log('[PWA-DEBUG] isPwaInstallAvailable():', window.isPwaInstallAvailable());
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          console.log('[PWA-DEBUG] SW registrations:', regs.length);
          regs.forEach(function(r, i) {
            console.log('[PWA-DEBUG] SW[' + i + '] scope:', r.scope, 'state:', r.active ? r.active.state : 'none');
          });
        }).catch(function(err) {
          console.error('[PWA-DEBUG] Error checking SW registrations:', err);
        });
      } else {
        console.warn('[PWA-DEBUG] serviceWorker API not available');
      }
      // Check manifest validity
      var manifestLink = document.getElementById('manifest-link') || document.querySelector('link[rel="manifest"]');
      if (manifestLink) {
        console.log('[PWA-DEBUG] Manifest link href:', manifestLink.href);
        fetch(manifestLink.href).then(function(r) {
          console.log('[PWA-DEBUG] Manifest fetch status:', r.status, r.statusText);
          return r.text();
        }).then(function(text) {
          try {
            var m = JSON.parse(text);
            console.log('[PWA-DEBUG] Manifest parsed OK. name:', m.name, 'start_url:', m.start_url, 'display:', m.display, 'icons:', m.icons ? m.icons.length : 0);
            if (m.icons) {
              m.icons.forEach(function(icon, i) {
                console.log('[PWA-DEBUG] icon[' + i + ']:', icon.src, icon.sizes, icon.purpose || 'any');
              });
            }
          } catch(e) {
            console.error('[PWA-DEBUG] Manifest JSON parse failed:', e);
          }
        }).catch(function(err) {
          console.error('[PWA-DEBUG] Manifest fetch error:', err);
        });
      } else {
        console.error('[PWA-DEBUG] No manifest link found in DOM!');
      }
      console.log('[PWA-DEBUG] === END DIAGNOSTIC ===');
    }, 3000);
  </script>
  <style>
    #loader {
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;  
      font-size: 14px;
      font-family: 'Poppins', sans-serif;
    }
    
    #loader.hidden {
      display: none;
    }
    
    #loader > div {
      width: 30px;
      height: 30px;
      position: relative;
      border: 3px solid #1336e5;
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 2s linear infinite;
      margin-bottom: 20px;
    }    

    #loader > span {
      color: black;
      
    }
      
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div></div>
    <span>Estamos preparando todo para ti, por favor espera un momento... </span>
  </div>

  <script>
    // --- DEBUG MODE: Captura de errores globales ---
    window.onerror = function(message, source, lineno, colno, error) {
      handleSplashError('Global Error', error || message + ' at ' + source + ':' + lineno);
      return false;
    };

    window.onunhandledrejection = function(event) {
      handleSplashError('Promise Rejection', event.reason);
    };

    function handleSplashError(errorType, error) {
      console.error('🔥 [FATAL]', errorType, ':', error);
      var text = document.querySelector("#loader > span");
      if (text) {
        text.innerHTML = '<div style="background: rgba(255,0,0,0.1); padding: 10px; border-radius: 8px; border: 1px solid red; margin-top: 10px;">' +
                         '<strong style="color: #d32f2f;">' + errorType + ':</strong><br>' +
                         '<small style="font-family: monospace; font-size: 11px; display: block; margin-top: 5px;">' + (error.message || error) + '</small>' +
                         '</div>';
      }
      var spinner = document.querySelector("#loader > div");
      if (spinner) spinner.style.animation = "none";
    }

    // Inyección de configuración de Flutter (Reemplazado por el build)
    {{flutter_js}}
    {{flutter_build_config}}

    // --- Inicialización Maestra ---
    (function() {
      console.log('🚀 [SPLASH] Preparando arranque de Catálogo...');
      
      const startFlutter = function() {
        try {
          console.log('📦 [SPLASH] Verificando cargador...');
          if (typeof _flutter === 'undefined' || !_flutter.loader) {
            console.warn('⚠️ [SPLASH] Cargador no listo, reintentando...');
            setTimeout(startFlutter, 100);
            return;
          }

          // Usamos backticks para mayor seguridad con el string inyectado
          var serviceWorkerVersion = `{{flutter_service_worker_version}}`;
          if (serviceWorkerVersion) {
            serviceWorkerVersion = serviceWorkerVersion.split('/*')[0].replace(/["']/g, '').trim();
          }

          console.log('📦 [SPLASH] Ejecutando _flutter.loader.load... SW:', serviceWorkerVersion || 'N/A');
          _flutter.loader.load({
            serviceWorkerSettings: {
              serviceWorkerVersion: serviceWorkerVersion,
            },
            onEntrypointLoaded: function(engineInitializer) {
              console.log('✅ [SPLASH] Entrypoint OK. Inicializando motor...');
              
              engineInitializer.initializeEngine({
                serviceWorkerVersion: serviceWorkerVersion,
                useColorEmoji: true,
              }).then(function(appRunner) {
                console.log('🎯 [SPLASH] Motor OK. Ejecutando app...');
                return appRunner.runApp();
              }).then(function() {
                console.log('🎉 [SPLASH] Catálogo listo.');
                setTimeout(function() {
                  var loader = document.getElementById("loader");
                  if (loader) loader.classList.add("hidden");
                }, 500);
              }).catch(function(error) {
                handleSplashError('Error Engine Interface', error);
              });
            }
          });
        } catch (e) {
          handleSplashError('Error Carga Inicial', e);
        }
      };

      // Iniciar cuando el DOM esté listo
      if (document.readyState === 'complete') {
        startFlutter();
      } else {
        window.addEventListener('load', startFlutter);
      }
    })();
  </script>
</body>
</html>
