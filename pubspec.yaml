name: menucom_catalog
description: "Catalogo para clientes CSM"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.5.2

environment:
  sdk: '>=3.4.1 <4.0.0'
dependencies:
  flutter:
    sdk: flutter

  pu_material:
    path: pu_material

  menu_dart_api:
    path: menu_dart_api

  cupertino_icons: ^1.0.6
  get: 4.6.6
  http: ^1.2.1
  flutter_localization: ^0.2.0
  flutter_svg: ^2.0.10+1
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.2.3
  url_launcher: ^6.3.2
  socket_io_client: ^2.0.3
  uuid: ^4.5.1
  intl: ^0.20.2
  pdf: ^3.11.1
  cached_network_image: ^3.4.1
  encrypt: ^5.0.3

dependency_overrides:
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  # rules and activating additional ones.
  flutter_lints: ^3.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/
    - assets/logo/
    - pubspec.yaml
    - pu_material/assets/

  fonts:
    - family: Sansation-bold
      fonts:
        - asset: fonts/Sansation_Bold.ttf
          weight: 700
        - asset: fonts/Sansation_Light.ttf
          weight: 300
        - asset: fonts/Sansation_Regular.ttf
          style: normal